# Set update schedule for GitHub Actions

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    ignore:
      # Self-referential: setup-get-tested is pinned by commit hash in action.yml.
      # Auto-bumping it churns action.yml on every merge and recreates the
      # get-tested-head prerelease for no real change. The wildcard covers both
      # the top-level action and the setup-get-tested sub-action.
      - dependency-name: "Kleidukos/get-tested*"
