name: Test actions pipeline

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  test-actions:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: bash ./.github/scripts/validate_setup_commit_hash.sh

      - name: Extract the tested GHC versions
        id: create-matrix
        uses: ./
        with:
          cabal-file: get-tested.cabal
          ubuntu-version: 'latest'
          macos-version: 'latest'

      - name: Extract the tested GHC version with older version
        uses: ./
        id: old-naming-scheme
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          version: 0.1.7.0
          cabal-file: get-tested.cabal
          ubuntu-version: 'latest'

      - name: Return a simple list of version
        uses: ./
        id: simple-list
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          version: 0.1.10.0-rc2
          cabal-file: get-tested.cabal
          versions-only: true

      - name: Extract the tested GHC versions with multiple runner versions
        id: multiple-runner-versions
        uses: ./
        with:
          cabal-file: get-tested.cabal
          ubuntu-version: '24.04,latest'
          version: 0.1.10.0-rc1

      - name: Return a simple list with an explicit version
        id: simple-list-explicit-version
        uses: ./
        with:
          version: 0.1.10.0
          cabal-file: get-tested.cabal
          versions-only: true

      - name: Check the simple list with an explicit version
        shell: bash
        env:
          MATRIX: ${{ steps.simple-list-explicit-version.outputs.matrix }}
        run: jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$MATRIX"

      - name: Output matrix
        shell: bash
        env:
          MATRIX: ${{ steps.create-matrix.outputs.matrix }}
        run: |
          bash ./.github/scripts/check_matrix_shape.sh matrix \
            '["macos-latest", "ubuntu-latest"]' '["ghc", "os", "newest", "oldest"]' <<< "$MATRIX"

      - name: Check the matrix for old naming scheme
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          MATRIX: ${{ steps.old-naming-scheme.outputs.matrix }}
        run: |
          bash ./.github/scripts/check_matrix_shape.sh matrix '["ubuntu-latest"]' '["ghc", "os"]' <<< "$MATRIX"

      - name: Check the simple list
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          MATRIX: ${{ steps.simple-list.outputs.matrix }}
        run: bash ./.github/scripts/check_matrix_shape.sh versions <<< "$MATRIX"

      - name: Check the matrix for multiple runner versions
        shell: bash
        env:
          MATRIX: ${{ steps.multiple-runner-versions.outputs.matrix }}
        run: |
          bash ./.github/scripts/check_matrix_shape.sh matrix \
            '["ubuntu-24.04", "ubuntu-latest"]' '["ghc", "os", "newest", "oldest"]' <<< "$MATRIX"

      - name: Set up without options
        id: setup
        uses: ./setup-get-tested

      - name: Set up with explicit directory
        id: setup-with-directory
        uses: ./setup-get-tested
        with:
          directory: "my-bin-dir"

      - name: Output results
        shell: bash
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          echo "${{ steps.setup.outputs.path }}"
          if [[ -x "${{ steps.setup.outputs.path }}" ]]; then
            echo "Is executable"
          else
            echo "Is NOT executable"
            exit 1
          fi

          echo "${{ steps.setup-with-directory.outputs.path }}"
          if [[ -x "${{ steps.setup-with-directory.outputs.path }}" ]]; then
            echo "Is executable"
          else
            echo "Is NOT executable"
            exit 1
          fi

  generate-matrix:
    name: Generate matrices to consume
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      versions: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Generate the matrix
        id: matrix
        uses: ./
        with:
          cabal-file: get-tested.cabal
          ubuntu-version: 'latest'
          macos-version: 'latest'

      - name: Generate the list of versions
        id: versions
        uses: ./
        with:
          cabal-file: get-tested.cabal
          versions-only: true

  consume-matrix:
    name: Use ${{ matrix.ghc }} on ${{ matrix.os }} as a matrix
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Check the matrix values
        shell: bash
        env:
          GHC: ${{ matrix.ghc }}
          OS: ${{ matrix.os }}
          NEWEST: ${{ matrix.newest }}
          OLDEST: ${{ matrix.oldest }}
        run: |
          echo "ghc=$GHC os=$OS newest=$NEWEST oldest=$OLDEST"
          [[ -n "$GHC" && -n "$OS" && -n "$NEWEST" && -n "$OLDEST" ]]

  consume-versions-only:
    name: Use ${{ matrix.ghc }} from versions-only as a matrix axis
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        ghc: ${{ fromJSON(needs.generate-matrix.outputs.versions) }}
        os: [ubuntu-latest]
    steps:
      - name: Check the matrix values
        shell: bash
        env:
          GHC: ${{ matrix.ghc }}
        run: |
          echo "ghc=$GHC"
          [[ -n "$GHC" ]]
